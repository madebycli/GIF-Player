[package]
name = "gif-player-renderer"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
publish = false

[dependencies]
anyhow = "1.0"
fastrand = "2.3"
image = { version = "0.25.10", default-features = false, features = ["gif"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
wayland-client = "0.31.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

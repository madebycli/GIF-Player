id = "madebycli/gif-player"
name = "GIF Player"
version = "0.2.0"
plugin_api = 28
author = "madebycli"
license = "Proprietary"
dependencies = ["gif-player"]
tags = ["animation", "desktop", "media", "utility"]
icon = "photo"
description = "Browse and control native click-through GIF overlays from Noctalia."

[[setting]]
key = "gif_dir"
type = "folder"
label_key = "settings.gif_dir.label"
description_key = "settings.gif_dir.description"
default = ""

[[setting]]
key = "launch_scale"
type = "double"
label_key = "settings.launch_scale.label"
description_key = "settings.launch_scale.description"
default = 0.7
min = 0.1
max = 5.0
step = 0.05

[[setting]]
key = "launch_opacity"
type = "double"
label_key = "settings.launch_opacity.label"
description_key = "settings.launch_opacity.description"
default = 1.0
min = 0.05
max = 1.0
step = 0.05

[[setting]]
key = "launch_speed"
type = "double"
label_key = "settings.launch_speed.label"
description_key = "settings.launch_speed.description"
default = 1.0
min = 0.1
max = 10.0
step = 0.1

[[setting]]
key = "launch_locked"
type = "bool"
label_key = "settings.launch_locked.label"
description_key = "settings.launch_locked.description"
default = true

[[setting]]
key = "launch_bounce"
type = "bool"
label_key = "settings.launch_bounce.label"
description_key = "settings.launch_bounce.description"
default = false

[[setting]]
key = "launch_jump"
type = "bool"
label_key = "settings.launch_jump.label"
description_key = "settings.launch_jump.description"
default = false

[[setting]]
key = "launch_jump_rate"
type = "double"
label_key = "settings.launch_jump_rate.label"
description_key = "settings.launch_jump_rate.description"
default = 6.0
min = 0.5
max = 60.0
step = 0.5

[[service]]
id = "bridge"
entry = "service.luau"

[[panel]]
id = "picker"
entry = "picker.luau"
width = 920
height = 780
placement = "attached"
position = "auto"
open_near_click = true

[[panel]]
id = "controls"
entry = "controls.luau"
width = 760
height = 720
placement = "attached"
position = "auto"
open_near_click = true

[[widget]]
id = "gif-player"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "photo"

  [[widget.setting]]
  key = "show_count"
  type = "bool"
  label_key = "settings.show_count.label"
  description_key = "settings.show_count.description"
  default = true

name: One-time repository restore

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.repository == 'madebycli/GIF-Player'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create clean source-only main branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_CHUNKS: >-
            85e573ce7c79749a4814a2dcc3d4518a9b94f769
            3fdeb84ca68163cb9f78857c9e8e4a121a994e39
            2df401a47c47009d256c708ce38a3286336fe687
            8f7098b374dbce31c89db189bfa8da5e11c2bc67
            454cc809bb82e3cadd7a850ed6a6458db746f1c7
          EXPECTED_SIZE: "58276"
          EXPECTED_SHA256: "627d82878e12fe963393c8e765d7729d5ce9157a40a2f45a1c274b1b40a97339"
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          archive="$work/repository.tar.xz"
          : > "$archive"

          for sha in $PAYLOAD_CHUNKS; do
            response="$work/$sha.json"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
              > "$response"
            python3 - "$response" "$archive" "$sha" <<'PY'
import base64, json, pathlib, sys
response, archive, sha = sys.argv[1:]
data = json.loads(pathlib.Path(response).read_text())
raw = base64.b64decode(data["content"])
with open(archive, "ab") as handle:
    handle.write(raw)
print(f"chunk {sha}: api_size={data['size']} decoded={len(raw)}")
PY
          done

          actual_size="$(stat -c %s "$archive")"
          actual_sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          echo "assembled size=$actual_size sha256=$actual_sha"
          test "$actual_size" = "$EXPECTED_SIZE"
          test "$actual_sha" = "$EXPECTED_SHA256"

          mkdir "$work/source"
          tar --warning=no-timestamp -xJf "$archive" -C "$work/source" --strip-components=1
          cd "$work/source"

          git init
          git config user.name "madebycli"
          git config user.email "madebycli@users.noreply.github.com"
          git add -A
          git commit -m "restore: rebuild repository from recovered sources"
          git branch -M main
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main

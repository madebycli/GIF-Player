name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test Python sources
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow pycairo build "setuptools>=69" wheel
          python -m compileall -q .
          PYTHONPATH=. python -m unittest discover -s tests -v
          PYTHONPATH=. python gif_player_cli.py --help >/dev/null
          python -m build --wheel --no-isolation

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Check and build Flake
        run: |
          nix flake metadata --no-write-lock-file . >/dev/null
          git diff --exit-code -- flake.lock
          nix flake check --no-write-lock-file --print-build-logs
          nix build .#gif-player --no-write-lock-file --print-build-logs
          ./result/bin/gif-player --help >/dev/null
          ./result/bin/gif-player self-test | grep -q '"protocol": 2'

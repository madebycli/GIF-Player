name: CI
# Verifies the stable compatibility surface plus the active beta native core.

on:
  push:
    branches: [main, beta/native-noctalia-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Cairo build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcairo2-dev pkg-config
      - name: Test Python compatibility sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install Pillow pycairo build "setuptools>=69" wheel
          python -m compileall -q .
          PYTHONPATH=. python -m unittest discover -s tests -v
          PYTHONPATH=. python gif_player_cli.py --help >/dev/null
          python -m build --wheel --no-isolation

  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check beta native core
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo fmt --all --check
          cargo run -q -p gif-player-core --bin gif-playerd-beta -- --self-test \
            | grep -q '"frontend_neutral":true'

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Verify compatibility lock, check, and build Flake
        run: |
          set -euo pipefail
          nix flake lock
          git diff --exit-code -- flake.lock
          nix flake show --no-write-lock-file
          nix flake check --no-write-lock-file --print-build-logs
          nix build .#gif-player --no-write-lock-file --print-build-logs
          ./result/bin/gif-player --help >/dev/null
          ./result/bin/gif-player self-test | grep -q '"protocol": 2'
      - name: Verify direct GitHub profile install
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIRECT_PROFILE: ${{ runner.temp }}/gif-player-profile
        run: |
          set -euo pipefail
          nix profile add --profile "$DIRECT_PROFILE" \
            "github:${GITHUB_REPOSITORY}#gif-player"
          test -x "$DIRECT_PROFILE/bin/gif-player"
          "$DIRECT_PROFILE/bin/gif-player" --help >/dev/null

name: CI
on:
  push:
    branches: [main, rewrite/noctalia-rust]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-wayland:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install native build and real Wayland test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxkbcommon-dev pkg-config fonts-dejavu-core sway grim desktop-file-utils
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Rust checks
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked --examples
          cargo build --release --locked --bin gif-player
      - name: Real Wayland fullscreen and input acceptance
        run: python3 tools/headless_acceptance.py --artifacts artifacts
      - name: Installation and diagnostics
        run: |
          set -euo pipefail
          make DESTDIR="$RUNNER_TEMP/install" PREFIX=/usr install
          test -x "$RUNNER_TEMP/install/usr/bin/gif-player"
          desktop-file-validate data/*.desktop
          XDG_DATA_HOME="$RUNNER_TEMP/plugin" target/release/gif-player install-plugin
          test -f "$RUNNER_TEMP/plugin/noctalia/plugins/gif-player/plugin.toml"
          target/release/gif-player doctor --offline
          target/release/gif-player self-test
      - name: Preserve input probe and compositor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayland-acceptance
          path: artifacts/
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Build engine and plugin, validate native closure and official plugin API
        run: |
          set -euo pipefail
          nix flake check --no-write-lock-file --print-build-logs
          nix build .#gif-player .#noctalia-plugin --no-write-lock-file --print-build-logs
          ./result/bin/gif-player --help >/dev/null
          ./result/bin/gif-player self-test | grep -q '"protocol":2'
      - name: Verify exact commit installation from GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIRECT_PROFILE: ${{ runner.temp }}/gif-player-profile
        run: |
          set -euo pipefail
          nix profile add --profile "$DIRECT_PROFILE" "github:${GITHUB_REPOSITORY}/${GITHUB_SHA}#gif-player"
          "$DIRECT_PROFILE/bin/gif-player" --version

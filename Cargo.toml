[package]
name = "noctalia-gif-player"
version = "1.4.0"
edition = "2024"
rust-version = "1.86"
description = "Native Rust Wayland GIF overlays and Noctalia 5 integration"
repository = "https://github.com/madebycli/GIF-Player"
license-file = "NOTICE.md"

[[bin]]
name = "gif-player"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gif = "0.14"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
fontdue = { version = "0.9", default-features = false, features = ["std"] }
libc = "0.2"
flate2 = "1"
toml_edit = "0.23"

[dev-dependencies]
tempfile = "3"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GIF Player</title>
  <desc id="desc">Layered animated frames and a play icon on a cyan, blue, and magenta background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061724"/>
      <stop offset="0.48" stop-color="#102c50"/>
      <stop offset="1" stop-color="#4b1458"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43f1e8"/>
      <stop offset="0.5" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#ff5fbd"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)"/>
  <g transform="translate(900 180)">
    <rect x="-128" y="-108" width="210" height="160" rx="24" fill="#43f1e8" opacity="0.14" stroke="#43f1e8" stroke-width="3" transform="rotate(-10)"/>
    <rect x="-75" y="-88" width="210" height="160" rx="24" fill="#7c8cff" opacity="0.17" stroke="#7c8cff" stroke-width="3" transform="rotate(4)"/>
    <rect x="-100" y="-72" width="224" height="170" rx="26" fill="#111b38" stroke="url(#accent)" stroke-width="5"/>
    <circle r="58" fill="#ffffff" opacity="0.12" filter="url(#glow)"/>
    <circle r="48" fill="url(#accent)"/>
    <path d="M-14-25L30 0L-14 25Z" fill="#071724"/>
    <g fill="#ffffff" opacity="0.68">
      <circle cx="-67" cy="-37" r="5"/>
      <circle cx="-48" cy="-37" r="5"/>
      <circle cx="-29" cy="-37" r="5"/>
    </g>
    <path d="M-68 66H88" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round"/>
    <path d="M-68 66H28" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="82" y="135" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-2">GIF Player</text>
    <text x="86" y="185" fill="#9ff8f4" font-size="24" font-weight="700" letter-spacing="2">ANIMATED WAYLAND DESKTOP OVERLAYS</text>
    <text x="86" y="237" fill="#eaf7ff" font-size="22">Pick, place, animate, and control your GIF collection.</text>
    <rect x="86" y="273" width="318" height="6" rx="3" fill="url(#accent)"/>
  </g>
</svg>
